  #     - ./rabbitmq:/var/lib/rabbitmq    
  #   ports:
  #     - "5672:5672"  # Порт для AMQP протокола
  #     - "15672:15672"  # Порт для веб-интерфейса
 
  # celery:
  #   build: .
  #   command: celery -A tgBot2 worker --loglevel=info
