  #     - .:/app
  #   depends_on:
  #     - rabbitmq

  # celery-beat:
  #   build: .
  #   command: celery -A tgBot2 beat --loglevel=info
  #   volumes:
  #     - .:/app
  #   depends_on:
  #     - rabbitmq

  bot:
    container_name: bot
    build: .
    restart: always
    command: >
      sh -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      python manage.py webhookstart &&
      uvicorn tgBot2.asgi:application --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./:/app              # Добавляем том для кода, чтобы изменения применялись сразу
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key}
      DEBUG: ${DEBUG:-True}
      POSTGRES_DB: ${POSTGRES_DB:-bot}
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOCAL_CACHE_DIR: /app/var/local_cache
      BOT_TOKEN: ${BOT_TOKEN:-1234567890:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}
      BASE_URL: ${BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


# Определяем том для PostgreSQL
volumes:
  redis_data:
  postgres_data: